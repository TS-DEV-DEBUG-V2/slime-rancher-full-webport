name: Sync to R2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Copy to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
        run: |
          rclone copy . r2:nostaligafun-files/games/games-accualy/OTHER/SlimeRancherFULL_Data \
            --exclude '.git/**' \
            --exclude '.github/**' \
            --fast-list \
            --transfers 32 \
            --checkers 32 \
            --retries 9999 \
            --low-level-retries 100 \
            --retries-sleep 4s \
            --s3-no-check-bucket \
            --progress
